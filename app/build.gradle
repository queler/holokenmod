apply plugin: 'com.android.application'
android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.holokenmod"
        minSdkVersion 24
        targetSdkVersion 36
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }
    namespace = 'com.holokenmod'
}
repositories {
    google()
    mavenCentral()
 }

dependencies {
}